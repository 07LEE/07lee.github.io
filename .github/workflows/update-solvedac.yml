name: Update solved.ac stats

# Saves the solved.ac numbers shown on the portfolio page into portfolio/solvedac.json.
# The page cannot call the solved.ac API itself (the API blocks browser calls from other sites),
# so this job fetches it once a month and commits the result.
# The date changes on every run, so a commit is made even when the numbers stay the same.
# That monthly commit also keeps GitHub from turning the schedule off after 60 days without activity.

on:
  schedule:
    - cron: '0 0 25 * *' # 25th of every month, 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-solvedac
  cancel-in-progress: false

env:
  HANDLE: 07lee
  OUTPUT: portfolio/solvedac.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and save stats
        run: |
          set -euo pipefail
          # solved.ac answers 403 to requests without a browser-like User-Agent.
          curl --fail --silent --show-error --max-time 30 --retry 3 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36' \
            "https://solved.ac/api/v4/users/${HANDLE}" -o response.json

          # Stop without touching the saved file when the response is not what the page expects.
          jq -e --arg handle "$HANDLE" '
            .handle == $handle
            and ([.tier, .rating, .solvedCount, .class] | all(type == "number"))
          ' response.json > /dev/null

          jq --indent 4 --arg date "$(TZ=Asia/Seoul date +%Y.%m.%d)" '{
            handle: .handle,
            tier: .tier,
            rating: .rating,
            solvedCount: .solvedCount,
            class: .class,
            updatedAt: $date
          }' response.json > "$OUTPUT"
          rm response.json

      - name: Commit
        run: |
          set -euo pipefail
          if git diff --quiet -- "$OUTPUT"; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT"
          git commit -m 'chore: update solved.ac stats' -m 'Refresh the saved numbers because the page cannot call the solved.ac API itself'
          git push
