<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="포트폴리오">
    <title>07lee | Portfolio</title>
    <link class="style-import" rel="stylesheet" href="style.css?v=6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="portfolio-layout">
        <!-- Left Sidebar: Project List & Filters -->
        <aside class="portfolio-sidebar">
            <header class="sidebar-header">
                <div class="brand">
                    <a href="../index.html" class="back-link" aria-label="메인 홈으로 이동">
                        <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                    </a>
                    <h1>Portfolio</h1>
                </div>
                <!-- Sidebar Toggle Menu Button -->
                <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" aria-label="메뉴 접기/펼치기">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </header>

            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="ai_ml">AI & ML</button>
                <button class="filter-btn" data-filter="computer_vision">Computer Vision</button>
                <button class="filter-btn" data-filter="automation">Automation</button>
                <button class="filter-btn" data-filter="analytics">Analytics</button>
            </div>

            <nav class="portfolio-list-container" id="portfolio-list">
                <p class="loading-msg">Loading project list...</p>
            </nav>

            <footer class="sidebar-footer">
                &copy; 2026 07lee. All rights reserved.
            </footer>
        </aside>

        <!-- Right Content Area: Detail View -->
        <main class="portfolio-main-content" id="portfolio-main-content">
            <!-- Welcome View (Shown when no project is selected) -->
            <section class="welcome-view" id="welcome-view">
                <div class="dashboard-container">
                    <header class="dashboard-header">
                        <h1>07lee | Portfolio Overview</h1>
                    </header>
                    <div class="dashboard-categories" id="dashboard-categories">
                        <!-- Dynamic dashboard sections will be injected here -->
                    </div>
                </div>
            </section>

            <!-- Detail Iframe View -->
            <section class="detail-frame-view" id="detail-frame-view" style="display: none;">
                <!-- Detail Top Header Bar -->
                <div class="detail-header">
                    <button class="close-detail-btn" id="close-detail-btn" aria-label="대시보드로 돌아가기">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                    </button>
                    <span class="detail-project-title" id="detail-project-title"></span>
                </div>
                <iframe id="project-iframe" src="" title="Project Detail Window"></iframe>
            </section>
        </main>
    </div>
    <script src="../main.js?v=6"></script>
</body>

</html>
