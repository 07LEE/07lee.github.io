<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="포트폴리오 - 데이터 파이프라인, 데이터 수집, 업무 자동화, 교육 프로젝트">
    <meta name="robots" content="noindex, nofollow">
    <title>07lee | Projects</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .container.wide {
            max-width: 1100px;
        }

        .page-title {
            margin: 0 0 0.5rem;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-accent);
        }

        .page-subtitle {
            margin: 0 0 2rem;
            color: var(--text-sub);
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.25rem;
        }

        .project-grid .featured-card {
            position: relative;
            justify-content: flex-start;
        }

        .project-grid .featured-card .card-meta {
            margin-top: auto;
        }

        .card-link {
            color: inherit;
            text-decoration: none;
        }

        .card-link::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 8px;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: auto;
        }

        .card-tag {
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            padding: 0.1rem 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-sub);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .card-github {
            position: relative;
            z-index: 1;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-decoration: none;
            white-space: nowrap;
        }

        .card-github:hover {
            color: var(--accent);
        }

        .error-msg {
            color: var(--text-sub);
        }
    </style>
</head>

<body>
    <div class="container wide">
        <header class="main-header">
            <div class="brand">
                <a href="index.html" class="brand-name">07lee</a>
            </div>
            <nav class="header-nav-links">
                <a href="index.html" class="nav-link">About</a>
                <a href="https://github.com/07lee" class="header-nav-link" target="_blank" rel="noopener noreferrer" aria-label="GitHub Profile" title="GitHub Profile">
                    <svg class="github-icon" viewBox="0 0 24 24">

                    </svg>
                </a>
            </nav>
        </header>

        <main>
            <section>
                <h1 class="page-title">Projects</h1>
                <p class="page-subtitle">데이터 파이프라인과 가공, 수집부터 업무 자동화, 개인·교육 프로젝트까지</p>

        </main>

        <footer>

</html>
