<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thought-Search | 3D Semantic Knowledge Graph</title>
    
    <!-- Libraries -->
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <!-- Left Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="header-left-group">
                <a href="../index.html" class="back-btn" aria-label="메인 페이지로 이동">
                    <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </a>
                <h1 class="logo-text">
                    07lee
                    <a href="https://github.com/07lee" class="github-link" target="_blank" rel="noopener noreferrer" aria-label="GitHub Profile">
                        <svg class="github-icon" viewBox="0 0 24 24">
                            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                        </svg>
                    </a>
                </h1>
            </div>
        </div>

        <nav class="navigation-tree">
            <div class="nav-title">Documents <span id="doc-count" style="text-transform: none; font-size: 0.7rem; color: var(--text-secondary); margin-left: 4px;"></span></div>
            <div class="legend" id="legend"></div>
        </nav>
        <footer class="sidebar-footer">
            &copy; 2026 07lee. All rights reserved.
        </footer>
    </aside>

    <!-- Right Main Content Area -->
    <main class="main-content">
        <!-- 1. Welcome & Visualization View (Initial State) -->
        <div id="welcome-view" class="content-view">
            <!-- Top Search Engine Area -->
            <div class="main-search-section">
                <div class="main-search-box">
                    <input type="text" class="main-search-input" id="main-search-input" placeholder="Search...">
                    <div class="main-search-results" id="main-search-results"></div>
                </div>
            </div>

            <!-- Stretched 3D Vector Plot in Framed Box -->
            <section class="viz-section">
                <div class="viz-container">
                    <div id="plot"></div>
                    
                    <div class="viz-overlay-controls">
                        <div class="control-group">
                            <label>연관 밀도 (Threshold: <span id="threshold-val">0.80</span>)</label>
                            <input type="range" id="threshold-slider" min="0.50" max="0.95" step="0.01" value="0.80">
                        </div>
                        <div class="orbit-control">
                            <label class="switch">
                                <input type="checkbox" id="orbit-toggle" checked>
                                <span class="slider round"></span>
                            </label>
                            <span class="orbit-label">Auto-Orbit</span>
                        </div>
                    </div>
                    
                    <div class="hint">
                        좌클릭 드래그: 회전 | 우클릭 드래그: 이동 | 휠: 확대/축소 | 노드 클릭: 문서 열기
                    </div>
                </div>
            </section>
        </div>

        <!-- 2. Document Content View (Active State) -->
        <div id="doc-view" class="content-view" style="display: none;">
            <article class="info-panel">
                <header class="info-header">
                    <div class="info-header-left">
                        <h1 class="info-title" id="info-title">문서 제목</h1>
                        <div class="info-path" id="info-path">path/to/document.md</div>
                        <div class="info-tags" id="info-tags"></div>
                    </div>
                    <div class="info-header-right">
                        <button class="close-panel-btn" id="close-panel-btn" aria-label="문서 닫기">×</button>
                        <div class="info-dates" id="info-dates">
                            <div class="info-date-row"><span class="date-label">Created:</span><span id="info-created">-</span></div>
                            <div class="info-date-row"><span class="date-label">Modified:</span><span id="info-modified">-</span></div>
                        </div>
                    </div>
                </header>
                <div class="info-body">
                    <div class="info-content" id="info-content">
                        문서 내용을 로드 중입니다...
                    </div>
                    <div class="related-section">
                        <div class="related-header">연관 지식 (Semantic Connections)</div>
                        <div class="related-list" id="related-list"></div>
                    </div>
                </div>
            </article>
        </div>
    </main>

    <!-- Custom Logic -->
    <script src="script.js"></script>
</body>
</html>
